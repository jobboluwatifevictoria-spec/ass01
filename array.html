<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    main {
      width: 50vh;
      /* background-color: blue; */
      background-image: url(/asset/imgi_30_default.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      height: 50vh;
      padding-top: 70px;
      padding-left: 30px;
      margin-left: 200px;
      margin-top: 9vh;
      border-radius: 30px;
      box-shadow: 0 25px 35px rgba(18, 12, 12, 0.3);
    }
    .pg {
      display: flex;
    }
    input {
      height: 25px;
      width: 280px;
      border-radius: 20px;
      padding-left: 10px;
      background-color: plum;
    }
    input:focus {
      background: rgba(164, 25, 207, 0.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transition: 0.4s;
      color: rgb(163, 153, 153);
      font-size: large;
    }
    button {
      width: 80px;
      height: 30px;
      background-color: rgb(255, 0, 144);
      border-radius: 20px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(73, 3, 51, 0.5);
    }
    .ans {
      margin-top: 10vh;
      margin-left: 20px;
      border-radius: 20px;
      width: 300px;
      height: fit-content;
      background-color: rgb(242, 126, 242);
      padding-left: 20px;
      padding-top: 30px;
    }
    h3 {
      margin-bottom: -12vh;
      border-radius: 20px;
      margin-left: 20px;
      width: 300px;
      background-color: rgb(242, 126, 242);
      text-decoration: underline;
      padding-left: 20px;
    }
  </style>
  <body>
    <main>
      <div class="pg">
        <input type="text" id="inn" placeholder="Input here" />
        <button id="add" onclick="show()">Submit</button>
      </div>
      <h3>***My List***</h3>
      <div id="result" class="ans"></div>
    </main>
    <script src="arrays.js"></script>
  </body>
</html>
