<body>

    <h1>Student Result Analyzer</h1>

    <input type="text" id="studentName" placeholder="Enter Student Name">

    <input type="number" id="English" placeholder="English Score">
    <input type="number" id="Math" placeholder="Math Score">
    <input type="number" id="Science" placeholder="Science Score">
    <input type="number" id="History" placeholder="History Score">
    <input type="number" id="Geography" placeholder="Geography Score">

    <button onclick="analyzeResult()">Analyze Result</button>

    <div id="result" class="result"></div>

    <h2>Student Records</h2>

    <p><strong>Total Students:</strong> <span id="studentCount">0</span></p>

    <table>
        <thead>
            <tr>
                <th>S/N</th>
                <th>Student Name</th>
                <th>Total Score</th>
                <th>Average Score</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="stud.js"></script>

</body>
