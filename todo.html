<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 500px; width: 100%;">
      
      <h3 class="text-center mb-4 fw-bold text-primary">
        <i class="bi bi-check2-square"></i> My Todo App
      </h3>

      <form>
        <!-- Task Name -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Task</label>
          <input type="text" id="task" class="form-control rounded-3" placeholder="Enter task title">
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Due Date</label>
          <input type="date" id="date" class="form-control rounded-3">
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control rounded-3" id="description" rows="3" placeholder="Enter task description"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button id="add" type="button" onclick="addTodo()" class="btn btn-primary btn-lg rounded-3">
            <i class="bi bi-plus-circle"></i> Add Todo
          </button>
            <button id="edit" type="button" onclick="updateTodo()" class="btn btn-warning btn-lg rounded-3">
            <i class="bi bi-plus-circle"></i> Update Todo
          </button>
        </div>
        
      </form>
      <div class="table-responsive mt-4">
  <table class="table table-striped table-hover table-bordered align-middle text-center">
    <thead class="table-primary">
      <tr>
        <th>S/N</th>
        <th>Task</th>
        <th>Date</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="display"></tbody>
  </table>
</div>

    </div>
    
  </div>
 <script src="todo.js"></script>
</body>
</html>
