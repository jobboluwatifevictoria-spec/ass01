<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#2563eb);
}

.container{

    width:380px;

    background:white;

    padding:35px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
    color:#2563eb;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:20px;
}

input{

    width:100%;

    padding:12px;

    border:2px solid #2563eb;

    border-radius:10px;

    font-size:18px;

    text-align:center;

    margin-bottom:20px;
}

button{

    width:100%;

    padding:12px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#1d4ed8;
}

#message{

    margin-top:20px;

    font-size:20px;

    font-weight:bold;
}

#attempt{

    margin-top:10px;

    color:#666;
}

</style>

</head>

<body>

<div class="container">

<h1>🎯 Number Guessing Game</h1>

<p>Guess a number between <strong>1 and 10</strong></p>

<input
type="number"
id="guess"
placeholder="Enter your guess">

<button onclick="checkGuess(secretNumber)">
Guess Number
</button>

<h2 id="message"></h2>

<p id="attempt">Attempts: 0</p>

</div>

<script>

let secretNumber = Math.floor(Math.random()*10)+1;

let attempts = 0;

// Parameterized Function
function checkGuess(number){

    let userGuess = Number(document.getElementById("guess").value);

    attempts++;

    document.getElementById("attempt").innerHTML =
    "Attempts: " + attempts;

    if(userGuess === number){

        document.getElementById("message").style.color="green";

        document.getElementById("message").innerHTML=
        "🎉 Correct! The number was " + number;

        secretNumber = Math.floor(Math.random()*10)+1;

        attempts = 0;

    }

    else if(userGuess > number){

        document.getElementById("message").style.color="red";

        document.getElementById("message").innerHTML=
        "📈 Too High!";

    }

    else{

        document.getElementById("message").style.color="orange";

        document.getElementById("message").innerHTML=
        "📉 Too Low!";

    }

    document.getElementById("guess").value="";
}

</script>

</body>
</html>
