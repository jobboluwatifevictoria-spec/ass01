<script>
  //A higher order function is a function that takes in another function
  // a callback function is a function that is passed into another function, to be executed (or called) later

  function greet(name, callback) {
    //Higher order
    console.log(`Hello, ${name}`);
    callback();
  }

  function goodBye() {
    //Call-back
    console.log(`Later now`);
  }

  greet("Ade", goodBye);

  function multiply(a, b, displayValue) {
    let result = a * b;

    displayValue(result);
  }

  function displayValue(result) {
    console.log(result * 54);
  }

  multiply(5, 4, displayValue);

  // Set Time out, a higher order function that runs after a set time.
