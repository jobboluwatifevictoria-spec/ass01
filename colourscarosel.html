<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .body {
      width: 800px;
      height: 900px;
      background-color: yellow;
    }
    .red {
      width: 800px;
      height: 900px;
      background-color: red;
    }
    .blue {
      width: 800px;
      height: 900px;
      background-color: blue;
    }
    .green {
      width: 800px;
      height: 900px;
      background-color: green;
    }
    .pink {
      width: 800px;
      height: 900px;
      background-color: pink;
    }
    .grey {
      width: 800px;
      height: 900px;
      background-color: grey;
    }
    button {
      width: 200px;
      height: 50px;
    }
  </style>
  <body>
    <div class="body" id="currentcolor"></div>
    <div class="bar"><button onclick="previousColor()">previous</button></div>
    <div class="for"><button onclick="nextColor()">next</button></div>
  </body>
</html>
<script>
  let colours = [
    ` <div class="body"></div>`,
    ` <div class="red"></div>`,
    `<div class="blue"></div>`,
    `<div class="green"></div>`,
    `<div class="pink"></div>`,
    `<div class="grey"></div>`,
  ];
  let index = 0;

  let currentcolor = document.getElementById("currentcolor");
  currentcolor.innerHTML = colours[index];

  function nextColor() {
    // alert("Welcome");
    index++;
    console.log(index);
    currentcolor.innerHTML = colours[index];
  }
  function previousColor() {
    alert("Go back 🤨");
  }
</script>
<script src="loops.js"></script>
